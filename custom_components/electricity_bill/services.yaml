add_bill:
  fields:
    period_start:
      required: false
      selector:
        date: {}
    period_end:
      required: false
      selector:
        date: {}
    kwh:
      required: true
      selector:
        number:
          min: 0.01
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    amount:
      required: true
      selector:
        number:
          min: 0.01
          step: 0.01
          mode: box
          unit_of_measurement: THB
    energy_charge:
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: THB
    ft_charge:
      required: false
      selector:
        number:
          step: 0.01
          mode: box
          unit_of_measurement: THB
    service_charge:
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: THB
    vat:
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: THB
    note:
      required: false
      selector:
        text: {}
    replace:
      required: false
      default: false
      selector:
        boolean: {}

remove_bill:
  fields:
    id:
      required: false
      selector:
        text: {}
    period_end:
      required: false
      selector:
        date: {}

reset_cycle: {}

set_baseline:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
          device_class: energy
    value:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10000000
          step: 0.001
          mode: box

get_summary:
  fields:
    kind:
      required: false
      default: daily
      selector:
        select:
          options:
            - daily
            - weekly
            - cycle
